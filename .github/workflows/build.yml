name: Build Kinemium Engine

on:
  push:
    branches: [nightly]
  pull_request:
    branches: [nightly]

jobs:
  build:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_flag: --debian
            platform: debian_x86-64
            exe: build/debian_x86-64/KinemiumRuntime
            archive: kinemium-linux.tar.gz
          - os: windows-latest
            build_flag: --windows
            platform: windows_x86-64
            exe: build/windows_x86-64/KinemiumRuntime.exe
            archive: kinemium-windows.zip
          - os: macos-latest
            build_flag: --macos
            platform: macos_x86-64
            exe: build/macos_x86-64/KinemiumRuntime.app
            archive: kinemium-macos.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install tools
        run: rokit install --no-trust-check

      - name: Build engine
        run: zune run build ${{ matrix.build_flag }}

      - name: Run executable (Linux)
        if: runner.os == 'Linux'
        run: timeout 10 ${{ matrix.exe }} --headless || [ $? -eq 124 ] && true

      - name: Install coreutils (macOS)
        if: runner.os == 'macOS'
        run: brew install coreutils

      - name: Run executable (macOS)
        if: runner.os == 'macOS'
        run: gtimeout 10 ${{ matrix.exe }} --headless || [ $? -eq 124 ] && true

      - name: Run executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "${{ matrix.exe }}" -ArgumentList "--headless" -PassThru
          $finished = $proc.WaitForExit(10000)
          if (-not $finished) { $proc.Kill() }
          elseif ($proc.ExitCode -ne 0) { exit 1 }

      - name: Archive build (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C build ${{ matrix.platform }}

      - name: Archive build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/${{ matrix.platform }} -DestinationPath ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }} on `${{ github.ref_name }}`
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: artifacts/*
