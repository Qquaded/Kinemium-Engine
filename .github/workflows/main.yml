name: Test Kinemium Engine  
  
on:  
  push:  
    branches: [ main, develop ]  
  pull_request:  
    branches: [ main, develop ]  
  
jobs:  
  test:  
    strategy:  
      matrix:  
        os: [ubuntu-latest, windows-latest, macos-latest]  
      
    runs-on: ${{ matrix.os }}  
      
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
        
      - name: Install Zig 0.15.1  
        uses: goto-bus-stop/setup-zig@v2  
        with:  
          version: 0.15.1  
        
      - name: Clone Zune repository  
        run: git clone https://github.com/Scythe-Technology/zune.git  
        
      - name: Build Zune  
        run: |  
          cd zune  
          zig build -Doptimize=ReleaseFast  
        
      - name: Add Zune to PATH  
        run: |  
          echo "$(pwd)/zune/zig-out/bin" >> $GITHUB_PATH  
        
      - name: Verify Zune installation  
        run: zune --version  
        
      - name: Run headless tests  
        run: zune run game --headless
