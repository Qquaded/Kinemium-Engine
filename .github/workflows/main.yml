name: Test Kinemium Engine  
  
on:  
  push:  
    branches: [ main, develop ]  
  pull_request:  
    branches: [ main, develop ]  
  
jobs:  
  test:  
    strategy:  
      matrix:  
        os: [ubuntu-latest, windows-latest, macos-latest]  
      
    runs-on: ${{ matrix.os }}  
      
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
        
      - name: Install Rokit (Linux/macOS)  
        if: runner.os != 'Windows'  
        run: |  
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash  
          echo "$HOME/.rokit/bin" >> $GITHUB_PATH  
        
      - name: Install Rokit (Windows)  
        if: runner.os == 'Windows'  
        run: |  
          Invoke-RestMethod https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.ps1 | Invoke-Expression  
          echo "$env:USERPROFILE\.rokit\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append  
        
      - name: Initialize Rokit project  
        run: rokit init  
        
      - name: Install Zune via Rokit  
        run: rokit add Scythe-Technology/zune  
        
      - name: Verify installations  
        run: |  
          rokit --version  
          zune --version  
        
      - name: Run headless tests  
        run: zune run game --headless
